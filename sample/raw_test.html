<html>
<!-- vim: set ts=4 ts=4: -->
<head>
<meta charset="UTF-8">
<title>HTMLファイルからPOSTでJSONデータを送信する</title>
<script type="text/javascript" src="http://192.168.33.1:8080/js/jquery.min.js"></script>
<script type="text/javascript" src="http://ajax.googleapis.com/ajax/libs/jquery/2.1.0/jquery.min.js"></script>

<script type="text/javascript">

function export_pdf(url, post_data) {

    var a = document.createElement("a");
    document.body.appendChild(a);
    a.style = "display: none";

    window.URL = window.URL || window.webkitURL;

    var xhr = new XMLHttpRequest();
    xhr.open('POST', url, true);
    xhr.setRequestHeader("Content-Type", "application/json;charset=UTF-8");
    xhr.responseType = 'blob'; 

    var w = window.open("", "preview");

    xhr.send(JSON.stringify(post_data));
    xhr.onload = function(e) {
        if (this.status == 200) { 

            var response_data = this.response;
            var file = new Blob([response_data], {type: 'application/pdf'});
            var url = URL.createObjectURL(file);
            w.location.href = url;
            w.revokeObjectURL(url);
        };
    };
};

$(function(){

    $("#button").on('click', function(){
        var JSONdata = {
        }; 
    export_pdf('/raw', JSONdata);
    });
});
</script>
</head>
<body>

<p>テンプレート：</p>
<textarea id="remarks_column" name="remarks_column" cols=120 rows=4></textarea>
<p><button id="button" type="button" >PDF生成!</button></p>
</body>
</html>
