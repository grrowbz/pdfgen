service: pytemp
provider:
  name: aws
  runtime: python2.7
  stage: ${opt:stage, self.custom.defaultStage}
  profile: ${opt:profile, self.custom.defaultProfile}
  region: ap-northeast-1
custom:
  defaultStage: dev
  defaultProfile: default
  pythonRequirements:
    slim: true
    zip: true
  apigwBinary:
    types:
      - "application/pdf"
  prune:
    automatic: true
    number: 3


functions:
  pytemp:
    handler: app/handler.lambda_handler
    events:
      - http:
          path: /generate
          method: post
          integration: lambda
          response:
            contentHandling: CONVERT_TO_BINARY
      - s3:
          bucket: "grrow.in"
          events:
            - "s3:ObjectCreated:*"
          existing: true
plugins:
  - serverless-prune-plugin
  - serverless-python-requirements
  - serverless-offline-python
  - serverless-apigw-binary
  - serverless-apigwy-binary

package:
  include:
    - app/*
    - lib/*
    - fonts/**
  exclude:
    - .python-version
    - app/*.pyc
    - app/haru/*.pyc
    - node_modules/**
    - package.json
    - package-lock.json
    - requirements.txt
    - tmp/**
    - tools/**
